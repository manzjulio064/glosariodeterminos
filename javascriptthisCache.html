  <!-- ***************************************Ejemplo 2***************************************** -->

  <script>

    class MiServicio {
      constructor() {
        this.cache = {};
      }

      guardarDato(clave, valor) {
        this.cache[clave] = valor;
      }

      obtenerCache() {
        return this.cache;
      }
    }

    const servicio = new MiServicio();

    servicio.guardarDato("usuario1", "Juan");
    servicio.guardarDato("usuario2", "Ana");

    console.log(servicio.cache);

  </script>
