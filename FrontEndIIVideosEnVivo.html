<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videos en vivo FrontEnd II</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        #sidebar {
            width: 300px;
            background-color: #f4f4f4;
            overflow-y: auto;
            transition: width 0.3s ease;
        }

        #sidebar.hidden {
            width: 0;
        }

        #toggle-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            /* background-color: #007bff; */
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            z-index: 1000;
            border-radius: 5px;
        }

        #fullscreen-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            z-index: 1000;
            border-radius: 5px;
        }

        #fullscreen-btn:hover {
            background-color: rgba(0, 0, 0, 0.8);
        }

        #main-content {
            flex: 1;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: margin-left 0.3s ease;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .video-list {
            margin-top: 15%;
            list-style: none;
            padding: 10px;
        }

        .video-list li {
            margin-bottom: 10px;
            cursor: pointer;
            padding: 5px;
            border-radius: 5px;
        }

        .video-list li:hover {
            /* text-decoration: underline; */
            background-color: #ddd;
        }

        .video-list li.active {
            background-color: #007bff;
            color: white;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            #sidebar {
                width: 70%;
            }

            #toggle-btn {
                top: 12px;
                left: 10px;
                padding: 5px;
            }
        }

        @media (max-width: 768px) and (orientation: landscape) {

            .video-list {
                margin-top: 7%;
            }

        }

    </style>
</head>
<body>

    <button id="toggle-btn">☰</button>
    <button id="fullscreen-btn">⛶</button>
    <div id="sidebar">
        <ul class="video-list">
            <!-- Lista de videos generada dinámicamente -->
        </ul>
    </div>
    <div id="main-content">
        <iframe id="video-player" src="https://player.vimeo.com/video/907876478?h=e26626b1bd&amp" allow="autoplay; fullscreen; picture-in-picture"></iframe>
    </div>


    <script>
        const videoBaseUrl = "https://player.vimeo.com/video/";
        const localStorageName = "JScriptFundVideos";

        const videoIds = [
            { id: "907876478?h=e26626b1bd&amp", name: "Presentacion Materia" },
            { id: "907898269?h=ed7d7fdb0b&amp", name: "2" },
            { id: "907918261?h=917d79fa1f&amp", name: "3" },
            { id: "907934708?h=94b56c7fc2&amp", name: "4" },
            { id: "907949963?h=cef2c5e16a&amp", name: "5" },
            { id: "907970026?h=e3b64c4782&amp", name: "6" },
            { id: "907989146?h=4ff2e8aaa8&amp", name: "7" },
            { id: "908009769?h=b9103c239e&amp", name: "8" },
            { id: "908031315?h=d07e5bdfd8&amp", name: "9" },
            { id: "908036230?h=565113ba7f&amp", name: "10" },
            { id: "908049005?h=36cfd17648&amp", name: "11" },
            { id: "908060269?h=55482b7e52&amp", name: "12" },
            { id: "908069041?h=3fbc956be2&amp", name: "13" },
            { id: "908686895?h=ff5eb8d3a8&amp", name: "14" },
            { id: "908753261?h=3f25a97ec1&amp", name: "15" },
            { id: "910761442?h=d7acc672bc&amp", name: "16" },
            { id: "910799637?h=b95b378bbc&amp", name: "17" },
            { id: "910822411?h=47444e0e9c&amp", name: "18" },
            { id: "910841431?h=7f8d2ebe1b&amp", name: "19" },
            { id: "911239961?h=9fe2b2e808&amp", name: "20" },
            { id: "911259870?h=615bfcd8ef&amp", name: "21" },
            { id: "911280769?h=bda785ce99&amp", name: "22" },
            { id: "912413541?h=9366c0ad05&amp", name: "23" },
            { id: "912423248?h=dbe5224a2e&amp", name: "24" },
            { id: "912432937?h=a4ad8e460e&amp", name: "25" }

        ];


        const sidebar = document.getElementById('sidebar');
        const toggleBtn = document.getElementById('toggle-btn');
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const mainContent = document.getElementById('main-content');
        const videoList = document.querySelector('.video-list');
        const videoPlayer = document.getElementById('video-player');

        // Obtener el índice del video seleccionado desde localStorage
        const savedIndex = localStorage.getItem(localStorageName);
        let currentIndex = savedIndex !== null ? parseInt(savedIndex, 10) : 0;

        // Función para alternar entre pantalla completa
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
                fullscreenBtn.textContent = "❌"; // Cambia el ícono al salir de pantalla completa
            } else {
                document.exitFullscreen();
                fullscreenBtn.textContent = "⛶"; // Cambia el ícono al entrar a pantalla completa
            }
        }

        // Función para ocultar o mostrar la barra lateral
        function toggleSidebar() {
            sidebar.classList.toggle('hidden');
            mainContent.style.marginLeft = sidebar.classList.contains('hidden') ? '0' : '0px';
        }


         // Función para cargar un video en el iframe
         function loadVideo(index) {
            const url = `${videoBaseUrl}${videoIds[index].id}&autoplay=1`;
            videoPlayer.src = url;

            // Guardar el índice seleccionado en localStorage
            localStorage.setItem(localStorageName, index);

            // Actualizar el estilo de los elementos de la lista
            updateActiveClass(index);

            toggleSidebar(); // Ocultar la barra lateral
        }

        // Función para resaltar el video seleccionado
        function updateActiveClass(index) {
            const items = document.querySelectorAll('.video-list li');
            items.forEach((item, i) => {
                item.classList.toggle('active', i === index);
            });
        }

        videoIds.forEach((video, index) => {
            const listItem = document.createElement('li');
            listItem.textContent = video.name ? video.name : `Clase ${index + 1}`;
            listItem.onclick = () => loadVideo(index);
            videoList.appendChild(listItem);
        });

        // Eventos para los botones
        toggleBtn.addEventListener('click', () => sidebar.classList.toggle('hidden'));
        fullscreenBtn.addEventListener('click', toggleFullscreen);

        // Cargar el video guardado o el primer video por defecto
        loadVideo(currentIndex);

    </script>
</body>
</html>
