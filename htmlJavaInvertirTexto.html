        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
        }
        textarea {
            width: 80%;
            height: 150px;

</head>
<body>
    <h2>Inversor de Palabras</h2>
    <textarea id="inputText" placeholder="Escribe aquí..."></textarea>
    <br>
    <button onclick="invertirTexto()">Invertir Palabras</button>
    <br>
    <textarea id="outputText" readonly placeholder="Resultado..."></textarea>

    <script>
        function invertirTexto() {
            let texto = document.getElementById("inputText").value;

            // Separar el texto en un array de palabras
            let palabras = texto.split(" ");

            // Mapear cada palabra para invertir sus caracteres
            let palabrasInvertidas = palabras.map(palabra => {
                // Separar la palabra en caracteres
                let caracteres = palabra.split("");
                console.log("Caracteres", caracteres);

                // Invertir el orden de los caracteres
                let caracteresInvertidos = caracteres.reverse();
                console.log("Invertir", caracteresInvertidos);

                // Unir los caracteres invertidos en una nueva palabra
                return caracteresInvertidos.join("");

            });

            // Unir las palabras invertidas en una cadena de texto
            let resultado = palabrasInvertidas.join(" ");

            // Mostrar el resultado en el textarea de salida
            document.getElementById("outputText").value = resultado;
        }
    </script>
</body>
</html>
