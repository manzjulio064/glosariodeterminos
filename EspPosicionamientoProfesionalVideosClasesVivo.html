<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://manzjulio064.github.io/glosariodeterminos/d48865cf5505cebc.css"
    />
    <link
      rel="stylesheet"
      href="https://manzjulio064.github.io/glosariodeterminos/4cb20a70a005a50b.css"
    />
    <link
      rel="stylesheet"
      href="https://manzjulio064.github.io/glosariodeterminos/dd4497a75999855e.css"
    />
    <link
      rel="stylesheet"
      href="https://manzjulio064.github.io/glosariodeterminos/6b5d0ae8c6d8f9fa.css"
    />
    <link
      rel="stylesheet"
      href="https://manzjulio064.github.io/glosariodeterminos/cbdf0184859274a8.css"
    />
    <link
      rel="stylesheet"
      href="https://manzjulio064.github.io/glosariodeterminos/player.css"
    />
    <link
      rel="stylesheet"
      href="https://manzjulio064.github.io/glosariodeterminos/digitalhousecssstandar.css"
    />
    <script>
      fetch(
        "https://manzjulio064.github.io/glosariodeterminos/shared-elements.html"
      )
        .then((response) => response.text())
        .then((data) => {
          document.head.innerHTML += data;
        });
    </script>
    <title>Video</title>
  </head>
  <body>
    <div class="container">
      <br />
      <div class="">
        <div class="layout">
          <div class="navigator">
            <div class="navigator__title">
              <div class="header">
                <h2 class="header__title header__title_xs">Clase en vivo</h2>
              </div>
            </div>
            <button class="navigator__button navigator__button_next">
              <div class="navigator__icon">
                <i
                  data-testid="icon"
                  class="uil icon uil-arrow-right icon_md"
                ></i>
              </div>
            </button>
          </div>
        </div>
        <div class="block-box x">
          <div>
            <div class="block-box__headline xx">
              <h2 class="block-box__title">Video 1/2</h2>
            </div>
            <div
              data-testid="VIMEO-player"
              class="video-block__content video-block__content_square"
              data-vimeo-initialized="true"
            >
            <iframe
                src="https://player.vimeo.com/video/1045152821?h=b6fbe74d66&amp"
                width="640"
                height="360"
                frameborder="0"
                allow="autoplay; fullscreen; picture-in-picture; clipboard-write"
                title="Com Efectiva V1.mp4"
                data-ready="true"
              ></iframe>
            </div>
          </div>

        </div>
        <div class="block-box x">
          <div>
            <div class="block-box__headline xx">
              <h2 class="block-box__title">Video 2/2</h2>
            </div>
            <div
              data-testid="VIMEO-player"
              class="video-block__content video-block__content_square"
              data-vimeo-initialized="true"
            >
            <iframe
                src="https://player.vimeo.com/video/1045167848?h=4571a4cc90&amp"
                width="640"
                height="360"
                frameborder="0"
                allow="autoplay; fullscreen; picture-in-picture; clipboard-write"
                title="Com Efectiva V1.mp4"
                data-ready="true"
              ></iframe>
            </div>
          </div>

        </div>

        
        <div class="block-box x">
          <div>
            <div class="block-box__headline xx">
              <h2 class="block-box__title">Video 2/2</h2>
            </div>
            <div
              data-testid="VIMEO-player"
              class="video-block__content video-block__content_square"
              data-vimeo-initialized="true"
            >
            <iframe
                src="https://player.vimeo.com/video/1045167848?h=4571a4cc90&amp"
                width="640"
                height="360"
                frameborder="0"
                allow="autoplay; fullscreen; picture-in-picture; clipboard-write"
                title="Com Efectiva V1.mp4"
                data-ready="true"
              ></iframe>
            </div>
          </div>

        </div>
        <div class="block-box x">
          <div>
            <div class="block-box__headline xx">
              <h2 class="block-box__title">Video 2/2</h2>
            </div>
            <div
              data-testid="VIMEO-player"
              class="video-block__content video-block__content_square"
              data-vimeo-initialized="true"
            >
            <iframe
                src="https://player.vimeo.com/video/1045167848?h=4571a4cc90&amp"
                width="640"
                height="360"
                frameborder="0"
                allow="autoplay; fullscreen; picture-in-picture; clipboard-write"
                title="Com Efectiva V1.mp4"
                data-ready="true"
              ></iframe>
            </div>
          </div>

        </div>
      </div>

      <br />
    </div>
  </body>
</html>
