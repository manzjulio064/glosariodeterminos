<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videos React</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        #sidebar {
            width: 300px;
            background-color: #f4f4f4;
            overflow-y: auto;
            transition: width 0.3s ease;
        }

        #sidebar.hidden {
            width: 0;
        }

        #toggle-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            /* background-color: #007bff; */
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            z-index: 1000;
            border-radius: 5px;
        }

        #fullscreen-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            z-index: 1000;
            border-radius: 5px;
        }

        #fullscreen-btn:hover {
            background-color: rgba(0, 0, 0, 0.8);
        }

        #main-content {
            flex: 1;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: margin-left 0.3s ease;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .video-list {
            margin-top: 15%;
            list-style: none;
            padding: 10px;
        }

        .video-list li {
            margin-bottom: 10px;
            cursor: pointer;
            padding: 5px;
            border-radius: 5px;
        }

        .video-list li:hover {
            /* text-decoration: underline; */
            background-color: #ddd;
        }

        .video-list li.active {
            background-color: #007bff;
            color: white;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            #sidebar {
                width: 70%;
            }

            #toggle-btn {
                top: 12px;
                left: 10px;
                padding: 5px;
            }
        }

        @media (max-width: 768px) and (orientation: landscape) {

            .video-list {
                margin-top: 7%;
            }

        }

    </style>
</head>
<body>

    <button id="toggle-btn">☰</button>
    <button id="fullscreen-btn">⛶</button>
    <div id="sidebar">
        <ul class="video-list">
            <!-- Lista de videos generada dinámicamente -->
        </ul>
    </div>
    <div id="main-content">
        <iframe id="video-player" src="https://player.vimeo.com/video/916950467?h=7adbd731d2&amp" allow="autoplay; fullscreen; picture-in-picture"></iframe>
    </div>

    <script>
        const htmlFile = window.location.pathname.split('/').pop().replace(".html", "");
        const videoBaseUrl = "https://player.vimeo.com/video/";
        const localStorageName = `Index${htmlFile}`;

        const videoIds = [
            { id: "916950467?h=7adbd731d2&amp", name: "FrontEndIIIReactJavaScriptVanillaClase1" },
            { id: "917134175?h=04ce07186d&amp", name: "FrontEndIIIReactHerramientasConocimientosUtilesClase2" },
            { id: "917610546?h=ce0ef45e89&amp", name: "FrontEndIIIReactRevisionYPracticaClase3" },
            { id: "917626419?h=f5dc4ebdaa&amp", name: "FrontEndIIIReactCreandounaaplicaciónconReactClase4" },
            { id: "917650790?h=8a7e3c5cc2&amp", name: "FrontEndIIIReactTrabajoconComponentesClase5" },
            { id: "917665544?h=b910355178&amp", name: "FrontEndIIIReactRevisionPractica1Clase6" },
            { id: "917686307?h=1736b1e37b&amp", name: "FrontEndIIIReactComponentesDinamicosClase7" },
            { id: "917700099?h=73a8737424&amp", name: "FrontEndIIIReactComponentesDeEstadoClase8" },
            { id: "917710559?h=268af9563b&amp", name: "FrontEndIIIReactRevisionPracticaClase9" },
            { id: "917736969?h=fd154917d1&amp", name: "FrontEndIIIReactClase10" },
            { id: "917749922?h=ab7c1e8cb5&amp", name: "FrontEndIIIReactEventosyFormulariosClase11" },
            { id: "926464838?h=03065bbc1d&amp", name: "FrontEndIIIReactClase12" },
            { id: "919193074?h=174447bfd9&amp", name: "FrontEndIIIReactClase13" },
            { id: "919215458?h=6c55a2984b&amp", name: "FrontEndIIIReactIntegracionconApisClase14" },
            { id: "919375377?h=1cee2cbed4&amp", name: "FrontEndIIIReactClase15" },
            { id: "919388539?h=0bd71baab2&amp", name: "FrontEndIIIReactRouterClase16" },
            { id: "919401290?h=ffe831767d&amp", name: "FrontEndIIIReactClase17" },
            { id: "925510955?h=b87dfc115f&amp", name: "FrontEndIIIReactClase18" },
            { id: "925535729?h=be26ed0edd&amp", name: "FrontEndIIIReactClase19" },
            { id: "925556061?h=5e809db76e&amp", name: "FrontEndIIIReactClase20" },
            { id: "925576129?h=cb9a71cef8&amp", name: "FrontEndIIIReactClase21" },
            { id: "926352694?h=40b4175df7&amp", name: "FrontEndIIIReactClase22" },
            { id: "926354620?h=c119e47ee3&amp", name: "FrontEndIIIReactClase23" },
            { id: "926373490?h=372d5df715&amp", name: "FrontEndIIIReactClase24" },
            { id: "926389307?h=8debca0c5e&amp", name: "FrontEndIIIReactClase25" },
            { id: "926403770?h=744c91a72e&amp", name: "FrontEndIIIReactClase26Final" }

        ];


        const sidebar = document.getElementById('sidebar');
        const toggleBtn = document.getElementById('toggle-btn');
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const mainContent = document.getElementById('main-content');
        const videoList = document.querySelector('.video-list');
        const videoPlayer = document.getElementById('video-player');

        // Obtener el índice del video seleccionado desde localStorage
        const savedIndex = localStorage.getItem(localStorageName);
        let currentIndex = savedIndex !== null ? parseInt(savedIndex, 10) : 0;

        // Función para alternar entre pantalla completa
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
                fullscreenBtn.textContent = "❌"; // Cambia el ícono al salir de pantalla completa
            } else {
                document.exitFullscreen();
                fullscreenBtn.textContent = "⛶"; // Cambia el ícono al entrar a pantalla completa
            }
        }

        // Función para ocultar o mostrar la barra lateral
        function toggleSidebar() {
            sidebar.classList.toggle('hidden');
            mainContent.style.marginLeft = sidebar.classList.contains('hidden') ? '0' : '0px';
        }


         // Función para cargar un video en el iframe
         function loadVideo(index) {
            const url = `${videoBaseUrl}${videoIds[index].id}&autoplay=1`;
            videoPlayer.src = url;

            // Guardar el índice seleccionado en localStorage
            localStorage.setItem(localStorageName, index);

            // Actualizar el estilo de los elementos de la lista
            updateActiveClass(index);

            toggleSidebar(); // Ocultar la barra lateral
        }

        // Función para resaltar el video seleccionado
        function updateActiveClass(index) {
            const items = document.querySelectorAll('.video-list li');
            items.forEach((item, i) => {
                item.classList.toggle('active', i === index);
            });
        }

        videoIds.forEach((video, index) => {
            const listItem = document.createElement('li');
            listItem.textContent = video.name ? video.name : `Clase ${index + 1}`;
            listItem.onclick = () => loadVideo(index);
            videoList.appendChild(listItem);
        });

        // Eventos para los botones
        toggleBtn.addEventListener('click', () => sidebar.classList.toggle('hidden'));
        fullscreenBtn.addEventListener('click', toggleFullscreen);

        // Cargar el video guardado o el primer video por defecto
        loadVideo(currentIndex);

    </script>
</body>
</html>
