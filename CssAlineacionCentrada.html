<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Closures</title>
</head>

<style>

  body, html {
    margin: 0;
    padding: 0;
  }

  .container {
    display: flex;
    justify-content: center;   /* Centra horizontalmente */
    align-items: flex-start;   /* Alinea arriba */
    height: 100vh;             /* Ocupa toda la altura de la pantalla */
    padding-top: 20px;         /* Espacio desde arriba */
    box-sizing: border-box;    /*cambia la forma en que se calcula el ancho y alto de los elementos.*/
  }

  h1 {
    text-align: center;
    font-size: 24px;           /* Ajusta para que se vea bien en móvil */
    max-width: 90%;            /* Evita que se desborde */
    word-break: break-word;    /* Asegura que el texto se corte bien */
  }
</style>
<body>

  <div class="container">
    <h1>Centrar etiqueta en el navegador</h1>
  </div>




</body>
</html>
