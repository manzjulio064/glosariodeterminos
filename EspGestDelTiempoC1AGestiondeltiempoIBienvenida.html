    />
    <script>
      fetch(
        "https://manzjulio064.github.io/glosariodeterminos/shared-elements.html"
      )
        .then((response) => response.text())
        .then((data) => {
          document.head.innerHTML += data;
        });
    </script>
    <title>Bienvenida</title>
  </head>
  <body>
    <div class="container">
      <br />
      <div class="">
        <div class="layout">
          <div class="navigator">
            <div class="navigator__title">
              <div class="header">
                <h2 class="header__title header__title_xs">Bienvenida</h2>
              </div>
            </div>
            <button class="navigator__button navigator__button_next">
              <div class="navigator__icon">
                <i
                  data-testid="icon"
                  class="uil icon uil-arrow-right icon_md"
                ></i>
              </div>
            </button>
          </div>
        </div>
        <div class="block-box x">
          <div>
            <div class="block-box__headline">
              <h2 class="block-box__title">Programa</h2>
            </div>
            <iframe
              src="https://docs.google.com/document/d/1hoJaZOm1x-NMDPQXaSAoqs6jx2AsLcl78328_mSBt-Q/preview"
              allowfullscreen=""
              title="BlockIframe"
              class="pdf-block__content pdf-block__content_square"
              data-gtm-yt-inspected-6="true"
            ></iframe>
          </div>
          <div class="block-box__heading-container">
            <p class="block-box__heading">Nos interesa tu opinión</p>
            <div class="block-box__feedback">
              <button class="block-box__button-like">
                <i
                  data-testid="icon"
                  class="uil icon uil-thumbs-up icon_nm"
                ></i></button
              ><button class="block-box__button-dislike">
                <i
                  data-testid="icon"
                  class="uil icon uil-thumbs-up icon_nm"
                ></i></button
              ><span class="dh-inline-block dh-relative dh-group"
                ><span class="dh-flex dh-justify-center"
                  ><button
                    class="block-box__button-report"
                    data-testid="report"
                  >
                    <svg
                      class="icon icon_nm"
                      viewBox="0 0 17 16"
                      fill="none"
                      xmlns="http://www.w3.org/2000/svg"
                    >
                      <path
                        d="M3 10.5001C7 7.0357 10 13.9645 14 10.5001V6.75008V3.00008C10 6.46445 7 -0.464296 3 3.00008V13.5001"
                        stroke="currentColor"
                        stroke-width="1.5"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      ></path>
                    </svg>
                  </button>
                  <div class="tooltip tooltip-top">
                    <div class="tooltip-content tooltip-arrow-top">
                      sugerir revisión
                    </div>
                  </div></span
                ></span
              >
            </div>
          </div>
        </div>
        <div class="block-box x">
          <div>
            <div class="block-box__headline">
              <h2 class="block-box__title">Introducción</h2>
            </div>
            <div
              data-testid="VIMEO-player"
              class="video-block__content video-block__content_square"
              data-vimeo-initialized="true"
            >
              <iframe
                src="https://player.vimeo.com/video/1045066951?h=5a9c4d9428&amp"
                width="426"
                height="240"
                frameborder="0"
                allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media"
                title="Video 1 - Gestion del tiempo V1.mp4"
                data-gtm-yt-inspected-6="true"
                data-ready="true"
              ></iframe>
            </div>
          </div>
          <div class="block-box__heading-container">
            <p class="block-box__heading">Nos interesa tu opinión</p>
            <div class="block-box__feedback">
              <button class="block-box__button-like">
                <i
                  data-testid="icon"
                  class="uil icon uil-thumbs-up icon_nm"
                ></i></button
              ><button class="block-box__button-dislike">
                <i
                  data-testid="icon"
                  class="uil icon uil-thumbs-up icon_nm"
                ></i></button
              ><span class="dh-inline-block dh-relative dh-group"
                ><span class="dh-flex dh-justify-center"
                  ><button
                    class="block-box__button-report"
                    data-testid="report"
                  >
                    <svg
                      class="icon icon_nm"
                      viewBox="0 0 17 16"
                      fill="none"
                      xmlns="http://www.w3.org/2000/svg"
                    >
                      <path
                        d="M3 10.5001C7 7.0357 10 13.9645 14 10.5001V6.75008V3.00008C10 6.46445 7 -0.464296 3 3.00008V13.5001"
                        stroke="currentColor"
                        stroke-width="1.5"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      ></path>
                    </svg>
                  </button>
                  <div class="tooltip tooltip-top">
                    <div class="tooltip-content tooltip-arrow-top">
                      sugerir revisión
                    </div>
                  </div></span
                ></span
